name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import time, crawl
          for api in crawl.SITES:
              t = time.time(); d = crawl.get(api, {"ac": "list", "pg": 1}, tries=1)
              print(api[:40], "OK" if d else "FAIL", (d or {}).get("pagecount"), round(time.time() - t, 1), "s")
          PY
